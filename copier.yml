# copier-python-uv — minimal Copier template for uv-based Python packages and apps.
#
#   uvx copier copy gh:cjw296/copier-python-uv ./my-thing --trust
#   uvx copier update --trust          # later, to pull template improvements
#
# --trust is required because the template runs git init + uv sync as post-tasks
# and makes an initial commit.

_subdirectory: template
_min_copier_version: "9.2.0"

_tasks:
  # On `copy` only: init the repo, format, and commit the generated layout. uv sync
  # runs first so an app's freshly-written uv.lock lands in that commit and ruff is
  # available; ruff format guarantees the initial commit is clean. `update` skips
  # these — the repo already exists and they would make a spurious commit.
  - command: "git init -q -b main"
    when: "{{ _copier_operation == 'copy' }}"
  - "uv sync"
  - command: "uv run ruff format ."
    when: "{{ _copier_operation == 'copy' }}"
  - command: "git add -A && git commit -q -m 'Initial layout from copier-python-uv'"
    when: "{{ _copier_operation == 'copy' }}"

project_type:
  type: str
  help: A reusable package (published to PyPI) or an application?
  choices:
    - package
    - app
  default: package

project_name:
  type: str
  help: Human-readable project name, e.g. "My Library"
  validator: "{% if not project_name.strip() %}project_name is required{% endif %}"

package_slug:
  type: str
  help: Importable package name (under src/, snake_case)
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

project_description:
  type: str
  help: One-sentence description
  default: ""

author_name:
  type: str
  default: Chris Withers

author_email:
  type: str
  default: chris@withers.org

github_org:
  type: str
  help: GitHub org or user
  default: cjw296

python_version:
  type: str
  help: Minimum Python (package) / target Python (app)
  default: "{% if project_type == 'app' %}3.14{% else %}3.12{% endif %}"

type_checker:
  type: str
  help: Type checker to wire into happy.sh and pyproject
  choices:
    - mypy
    - ty
  default: "{% if project_type == 'app' %}ty{% else %}mypy{% endif %}"

tmpdir_fixture:
  type: bool
  help: Add a tmpdir fixture (testfixtures.TempDir) to conftest.py?
  default: true

logging:
  type: str
  help: Add a tested LogCapture fixture for which logging framework(s)?
  choices:
    none: none
    stdlib logging: stdlib
    loguru: loguru
    stdlib + loguru: both
  default: stdlib

# --- computed, not prompted ---
project_slug:
  type: str
  when: false
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

current_year:
  type: str
  when: false
  default: "2026"
